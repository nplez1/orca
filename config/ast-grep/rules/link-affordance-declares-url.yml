# A web link opened from Orca's own UI carries one right-click menu (in-app / system / copy), and the
# root menu finds the address through data-link-url. An element that opens a link without declaring
# it is a link whose menu never appears - how the Checks-panel PR id shipped with no menu at all.
#
# Scope: an inline onClick that calls one of the openers below. A handler passed by reference -
# `onClick={onOpenReview}` or `onClick={item.action}` - reaches the opener one call deep, so the rule
# cannot see it: check those by hand when you touch a link affordance and declare the address there.
id: link-affordance-declares-url
language: tsx
severity: error
message: Declare data-link-url on the element that opens this web link, so the app's link menu can offer in-app, system-browser and copy.
files:
  - src/renderer/**
ignores:
  - '**/*.test.*'
  - '**/*.spec.*'
  - '**/*.fixture.*'
rule:
  any:
    - kind: jsx_opening_element
      all:
        - has:
            kind: jsx_attribute
            all:
              - has: { kind: property_identifier, regex: '^onClick$' }
              - has:
                  kind: jsx_expression
                  regex: 'openAppHttpLink\(|openContextualHttpLink\(|openOwnedHttpLink\(|openArtifactInBrowser\(|shell\.openUrl\('
        - not:
            has:
              kind: jsx_attribute
              has: { kind: property_identifier, regex: '^data-link-url$' }
        # An anchor already carries its address, and a menu row or the browser's own page menu owns
        # the gesture it sits in.
        - not:
            all:
              - has: { field: name, regex: '^a$' }
              - has:
                  kind: jsx_attribute
                  has: { kind: property_identifier, regex: '^href$' }
        - not:
            has: { field: name, regex: 'DropdownMenu(Item|RadioItem|CheckboxItem)$' }
        - not:
            has:
              kind: jsx_attribute
              all:
                - has: { kind: property_identifier, regex: '^role$' }
                - has: { kind: string, regex: 'menuitem' }
    - kind: jsx_self_closing_element
      all:
        - has:
            kind: jsx_attribute
            all:
              - has: { kind: property_identifier, regex: '^onClick$' }
              - has:
                  kind: jsx_expression
                  regex: 'openAppHttpLink\(|openContextualHttpLink\(|openOwnedHttpLink\(|openArtifactInBrowser\(|shell\.openUrl\('
        - not:
            has:
              kind: jsx_attribute
              has: { kind: property_identifier, regex: '^data-link-url$' }
        - not:
            all:
              - has: { field: name, regex: '^a$' }
              - has:
                  kind: jsx_attribute
                  has: { kind: property_identifier, regex: '^href$' }
        - not:
            has: { field: name, regex: 'DropdownMenu(Item|RadioItem|CheckboxItem)$' }
        - not:
            has:
              kind: jsx_attribute
              all:
                - has: { kind: property_identifier, regex: '^role$' }
                - has: { kind: string, regex: 'menuitem' }
