scripts:
  setup: |
    node config/scripts/run-internal-dev-setup.mjs
    pnpm install

# LOCAL(nplez1): fork-only. Allocates an ephemeral machine per worktree from the team provisioning
# system. Inert until the verbs in local/orca-vm/*.sh are wired. See LOCAL-PATCHES.md.
environmentRecipes:
  - id: team-machine
    name: Team machine
    description: Ephemeral dev machine allocated on demand for this worktree
    create: ./local/orca-vm/create.sh
    suspend: ./local/orca-vm/suspend.sh
    resume: ./local/orca-vm/resume.sh
    # Orca offers only the lifetimes declared here, and counts down only to a `releaseAt` the recipe
    # publishes. Declaring these is enough for the Extend lifetime action to be offered; the
    # countdown chip waits for create.sh to report a deadline, and there is nothing to show until it
    # does.
    extend: ./local/orca-vm/extend.sh
    extendDurations: [1h, 4h, 24h]
    destroy: ./local/orca-vm/destroy.sh
