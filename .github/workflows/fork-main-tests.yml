name: Fork main unit tests

# Why: `fork-main-gates.yml` covers the static rules on the release line, but this fork's main
# branch ran **no tests at all** — only scheduled maintenance jobs. So a sync or merge could leave
# 74 failing tests on `nplez1/main` and the first anyone heard of it was an unrelated PR inheriting
# a red `test / tests` shard, with no way to tell which change caused it.
#
# Nightly rather than on every push: a merge to main is normally the tree a PR just tested, so a
# second full suite per push mostly pays twice to re-tread the same shards. The nightly catches
# what a sync's own gates miss, and `workflow_dispatch` is there to run it on demand.
#
# Reuses `unit-tests.yml` and the same shard plan the PR workflow uses, so a failure here means the
# same thing it means there.
on:
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Why the ref is in the group: `workflow_dispatch` can target any branch, and a dispatch on a feature
  # branch must not cancel the release line's nightly — nor share its slot.
  # Why `cancel-in-progress: true`: a run that never finishes must not hold the slot for the next
  # night. Under `false` it holds until a human cancels it — which is what happened on 2026-10-26: the
  # 10-27 schedule never ran because the wedged run was still holding the slot, so one stuck job cost
  # a night of coverage even though the schedule itself fired. Superseding is safe here: a test shard
  # takes minutes, and the next schedule is a day away. `plan` is the one job with no
  # `timeout-minutes` of its own (default 360), so it is the worst case for holding the slot.
  group: fork-main-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Shard plan
        id: plan
        run: node config/scripts/ci-unit-plan.mjs

  test:
    needs: [plan]
    # Parity with the PR workflow: same Node major, same runner, same shard assignments.
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      runner: ubuntu-24.04-arm
      shards: ${{ needs.plan.outputs.shards }}
      # Why: the relay job in `unit-tests.yml` hard-codes `blacksmith-4vcpu-ubuntu-2404`, and this
      # fork has no runner for that label — it queued for ~17.5 h in the 2026-10-26 run and was
      # cancelled. The fork ships no cloud relay, so the job has nothing to test here. What it drops:
      # the two `relay-region` unit files, which shard discovery excludes and only that job ran.
      # `browser_contract` is not dropped — this caller never enabled it (its default is `false`).
      run_relay_integration: false
