name: Fork PR gates

# Why this exists: `pr.yml` is `disabled_manually` on this fork, so a pull request has no status
# checks at all while the ruleset requires one — and the reason recorded for disabling it (billed
# minutes) does not hold. Standard runners bill nothing on a public repository: the Actions timing API
# returns 0 ms for the nightly (7 jobs) and for a full three-platform release. See `LOCAL-PATCHES.md`
# § local(ci), which also records the decision this file implements.
#
# Why these three gates and not `pr.yml`: upstream's file is the whole fleet — package, e2e, relay,
# cross-version-wire, mobile web, Windows probes — it arrives with every sync, and it spends 40+
# minutes per PR re-treading a branch that just ran the same suites locally. Typecheck, the
# changed-lines quality gate and the repo-wide lint verdict are the classes that reached this fork's
# release line unnoticed and are green to enforce on any branch today. The unit suite is not here on
# purpose: `ci-unit-selection.mjs` turns one changed file into ~3,000 of 13,064 test files, which is a
# shard planner, not a PR lane. It runs nightly and now also gates a release.
#
# Why the lint verdict and not `pnpm lint` in the third job: `pnpm lint` is one `&&` chain, so it stops
# at the first failing step and says nothing about the rest — and on this fork's own base it is red,
# because the base carries foreign reds recorded in `local/lint-known-red.json`. A lane that re-ran it
# would be red on every PR and teach everyone to ignore red. `local/gate-lint.mjs` runs every step on
# its own and turns the set of failures into a verdict against that file: a red recorded there is
# reported with its class and owner, one outside it fails this job. That is what makes the lane green
# by construction on any base while still failing the PR that introduces a ratchet regression — which
# #361 did not do when it left `main` red on `check:focus-read-ratchet` (issue #399).
#
# Draft PRs run it too: the cost is a few free minutes, and a draft whose types do not compile is
# worth knowing about before it is marked ready.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    # Why the prefix: the ruleset matches a check by name, so a bare `typecheck` could be satisfied by
    # any other workflow that happens to run a job with that name.
    name: 'fork-pr-gates: typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Why `native-runtime: node`: the same preparation `fork-main-gates.yml` uses before `pnpm tc`
      # on this runner, so a green here means what a green there means.
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Typecheck
        run: pnpm tc

  changed-lines:
    name: 'fork-pr-gates: changed lines'
    # Why pull_request only: the gate diffs the pull request's merge commit against its first parent,
    # and on a dispatch HEAD is not a merge commit — it would fall back to merge-base against a base
    # branch a shallow checkout does not have. A dispatch still runs the typecheck half.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Why depth 2: the gate diffs the pull request's merge commit against its first parent, and a
      # single-commit clone does not carry the base tree it needs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none

      # The rule set the repository already enforces on a diff, scoped to this pull request's own
      # lines: a finding on code the PR did not touch is debt on the base, not this change's problem.
      - name: Changed-lines code quality
        run: pnpm run check:code-quality:changed

      # Why here and not only on the release line: the fork's `node --test` files are outside
      # `UNIT_INCLUDE`, so no unit lane collects them, and a release-line-only lane reports a broken
      # `local/sync/lib` assertion after the merge rather than before it. This job already has Node 24,
      # so the two steps cost about twenty seconds. Why `!cancelled()`: a changed-lines finding must not
      # hide them.
      - name: Fetch the recorded upstream sync base
        if: ${{ !cancelled() }}
        run: |
          base=$(node -p 'require("./local/upstream-file-comments-baseline.json").base ?? ""')
          if [ -z "$base" ]; then
            echo "no sync base is recorded in local/upstream-file-comments-baseline.json" >&2
            exit 1
          fi
          git fetch --depth=1 origin "$base"

      # Why the fetch above: the max-lines exemption test compares the baseline against the upstream
      # commit this fork's sync is keyed to, and a CI checkout has no upstream ref at all. It fails
      # rather than skipping when that commit is absent.
      - name: Fork-local tooling tests
        if: ${{ !cancelled() }}
        run: node local/run-fork-tests.mjs

  lint:
    name: 'fork-pr-gates: lint gate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Why depth 2: `check:code-quality:changed`, one of the steps inside the gate, diffs the pull
      # request's merge commit against its first parent, and a single-commit clone carries neither.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      # Why `native-runtime: node`: the same preparation `fork-main-gates.yml` gives the gate on the
      # release line, so a green here means what a green there means.
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Why: `check-upstream-file-comments` measures the fork's comments against the sync base the
      # baseline records, and a CI checkout has no such commit — the same fetch both other jobs need.
      - name: Fetch the recorded upstream sync base
        run: |
          base=$(node -p 'require("./local/upstream-file-comments-baseline.json").base ?? ""')
          if [ -z "$base" ]; then
            echo "no sync base is recorded in local/upstream-file-comments-baseline.json" >&2
            exit 1
          fi
          git fetch --depth=1 origin "$base"

      # Why: `check:code-quality:changed` resolves its base from `origin/main`, which a shallow
      # checkout of a branch ref need not carry. A missing ref would red the gate for the wrong
      # reason, and a gate that is red for the wrong reason is the failure class this lane exists to
      # avoid.
      - name: Fetch the base the changed-lines step diffs against
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      # The whole lint chain plus the fork's own steps, each run on its own and judged against
      # `local/lint-known-red.json`: a foreign red at the base passes, this PR's own new one fails.
      - name: Lint ratchet verdict
        run: node local/gate-lint.mjs
