name: Fork base gates

# Why: a PR runs the *changed-lines* gate plus the full test suite, but the cheap
# repo-wide rules (oxlint, including `max-lines`; the anti-slop naming rules; the
# localization catalogs) only ever run against a PR's own diff, or against whatever
# branch CI happens to build. So debt lands on this fork's release line unnoticed and
# is inherited by the next PR that touches one of those files — which is how a single
# Jira change inherited six over-cap files and a stale naming error.
#
# This runs those rules on the release line itself, where the debt is created, so it is
# caught the day it lands instead of the day someone else trips over it.
#
# Why the lint verdict step as well as the named families: the four families below are a
# third of what `pnpm lint` runs. The ratchets it does not name here were never run on the
# release line at all, so #361 merged green and left `main` red on
# `check:focus-read-ratchet` for the next branch to allowlist (issue #399).
# `local/gate-lint.mjs` runs the whole set and classifies it against
# `local/lint-known-red.json`, which is what makes it green on a base that carries foreign
# reds while still failing the push that adds one.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-base-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    # Caps a hung `pnpm tc` at 40 min instead of the default 360. It would not have bounded the
    # 2026-10-26 nightly's 17.5 h wait: that job never started, and a timeout only counts once a runner
    # picks the job up. `cancel-in-progress: false` stays — a merge must not replace a running gate with
    # a `cancelled` conclusion, which is what hid that run's red shards.
    # Why 50 rather than 40: the lint verdict below was added on 2026-11-12, and it runs ~50 steps the
    # named ones above do not (measured 83 s on an 18-core host, so a few minutes on a runner). At 40 a
    # slow-but-finishing `pnpm tc` would time the job out before the ratchet set ever ran.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # The repo-wide rule set, unchanged from `pnpm lint`, one step per rule family so
      # the failing family is named without reading a log.
      - name: Repo-wide lint
        run: pnpm exec oxlint --format github

      - name: Fork identity in tests
        run: node config/scripts/check-upstream-identity-literals.mjs

      - name: Reject low-evidence patterns
        run: pnpm run audit:anti-slop

      - name: Max-lines ratchet
        run: pnpm run check:max-lines-ratchet

      - name: Localization catalogs
        run: |
          pnpm run verify:localization-catalogs
          pnpm run verify:localization-extraction
          pnpm run verify:localization-coverage

      # Why `!cancelled()`: this step had none until 2026-11-12, and the red step above it skipped it
      # for eight consecutive pushes to `main` — so `pnpm tc` did not run on the release line for a
      # morning and nothing said so.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm tc

      # Why last, and why `!cancelled()`: these two used to sit first, so a failed fetch or a broken
      # `local/sync/lib` assertion hid every rule above them for the rest of the run. The fork's own
      # `node --test` files sit outside `UNIT_INCLUDE`, so no unit lane collects them, and before this
      # the only thing that ran them was a hand-started release gate.
      - name: Fetch the recorded upstream sync base
        if: ${{ !cancelled() }}
        run: |
          base=$(node -p 'require("./local/upstream-file-comments-baseline.json").base ?? ""')
          if [ -z "$base" ]; then
            echo "no sync base is recorded in local/upstream-file-comments-baseline.json" >&2
            exit 1
          fi
          git fetch --depth=1 origin "$base"

      # Why the fetch above: the max-lines exemption test compares the baseline against the upstream
      # commit this fork's sync is keyed to, and a CI checkout has no upstream ref at all. It fails
      # rather than skipping when that commit is absent.
      - name: Fork-local tooling tests
        if: ${{ !cancelled() }}
        run: node local/run-fork-tests.mjs

      # Why: the named steps above are four families of the lint chain. The other ~45 — the focus-read,
      # path-literal, ast-grep, workspace-read and tab-map ratchets among them — ran only in a hand-run
      # release gate, so a regression sat on `main` until an unrelated branch found and allowlisted it
      # (#361, #399). The gate runs every step of the chain plus the fork's own, each on its own, and
      # turns the set of failures into a verdict against `local/lint-known-red.json`: a foreign red is
      # reported with its class and owner, one outside the list fails this run.
      # Why after the fetch above: `check-upstream-file-comments` measures against the recorded sync
      # base, which a CI checkout does not have — the same reason the max-lines exemption test needs it.
      # Why `ORCA_CODE_QUALITY_BASE: HEAD`: the gate also runs the diff-scoped steps
      # (`check:code-quality:changed` and the flaky-test-pattern ratchet), whose base on the release
      # line is the release line itself. Those steps judge a diff, which is a PR's job and runs in
      # `fork-pr-gates.yml`; here they must not depend on a remote ref a shallow checkout may lack, and
      # a gate red for a missing ref rather than for a finding is the failure this lane exists to
      # prevent.
      - name: Lint ratchet verdict
        if: ${{ !cancelled() }}
        env:
          ORCA_CODE_QUALITY_BASE: HEAD
        run: node local/gate-lint.mjs
