name: Fork release

# Builds distributable macOS, Windows and Linux artifacts from this fork and publishes them as a
# GitHub release here. That release is the update feed this fork's builds point at (see
# LOCAL-PATCHES.md), so publishing here is what makes an installed build update itself.
#
# Every upstream release workflow is a no-op in a fork — they all guard on
# `github.repository == 'stablyai/orca'` — and they publish to stablyai's separate
# orca-hourly/orca-daily/orca-adhoc repos. This one publishes to the fork itself, which
# is why it needs no GitHub App token: the workflow's own GITHUB_TOKEN can create
# releases in its own repository.
#
# Nothing publishes without evidence: `unit-tests` below runs the unit suite on the dispatched commit,
# `typecheck` and `lint` run the compiler's and the lint gate's verdicts on it, and every artifact leg
# waits for all three. Before 2026-10-29 the header here said the opposite — a dispatch from the Actions
# UI published to every auto-updating install with no test evidence at all, because the local release
# gate's verdict lives in `.git/orca-gate/` on one machine, which CI cannot see. To release without
# waiting for a full run there is no flag: fix the red, or classify it in
# `local/nightly-linux-known-red.json` (the suite) or `local/lint-known-red.json` (lint) with evidence —
# and a typecheck red has no allowlist, so the only fix is a clean `pnpm tc`.
#
# Why `typecheck` and `lint` are jobs here at all (#298): until 2026-11-14 the compiler's verdict at
# publish time was whatever the dispatcher happened to run by hand. The 2026-11-08 sync is the case —
# `PROVIDER_DISPLAY_NAMES` and `USAGE_PROVIDER_IDS` were short after a rate-limit union merged, and
# `pnpm tc` was the only thing that noticed, so this workflow would have built and published from that
# tree. `fork-main-gates.yml` and `fork-pr-gates.yml` do run both verdicts, but nothing at dispatch time
# reads them: `local/dispatch-release.mjs` checks the review, the tree, the ref and the Actions fleet,
# not whether `Fork base gates` came back green for the commit being published — and that lane was red
# for eight consecutive pushes on 2026-11-12, with its `Typecheck` step skipped in all eight.
#
# What is also gated is the dispatch itself: the `release-ref` job refuses any ref but
# `refs/heads/main`, and any tag that already points at another commit. `publish` runs the same guard
# again immediately before the undraft, which is what makes `gh run rerun --failed` a safe retry — it
# keeps a `release-ref` that passed, and the tags that guard read can have moved since.
#
# The shape of the run: the gates, then `release-draft` creates the draft with its body, then the
# `macos`, `windows` and `linux` legs build and upload into that draft in parallel, then `publish`
# checks every manifest and the body and makes it public. Until 2026-11-16 the legs ran one after
# another — 44 minutes of a 50-minute run in v1.4.214-np.56 — because the draft was created inside
# `macos`, and a leg that started first would have created the release itself.
#
# Why every `uses:` is pinned to a commit SHA with its tag in a trailing comment: these jobs hold
# `contents: write` and, on macOS, the Apple certificate and notarisation secrets. The repository
# allows `allowed_actions: all` with `sha_pinning_required: false`, so a moved tag would run new code
# inside the signing job. `oven-sh/setup-bun` in `unit-tests.yml` is already pinned, so the standard
# is the repository's own. Refresh a pin by re-reading the tag's commit and updating both halves.

# Why every job that holds a secret or a write token names `environment: release`: a
# `workflow_dispatch --ref <branch>` runs *that branch's* copy of `fork-release-ref-guard.sh` and of
# `release-draft`'s body, so a guard is only worth what the runner's ref policy is — anyone who can
# push a branch and dispatch could neuter it and read the Apple signing secrets, or push a tag with
# `contents: write`. The environment is branch-restricted to `main` in repository settings (Settings →
# Environments → release → Deployment branches: `main`), which GitHub enforces before a job's steps
# run. That setting is repository state a sync cannot carry, so it is recorded in LOCAL-PATCHES.md.
#
on:
  workflow_dispatch:
    inputs:
      # Why this exists: the review gate runs on a local commit, but the build runs on whatever `main`
      # is when the run starts. Without this, a merge that lands after the gate passes is published
      # unreviewed. `local/dispatch-release.mjs` fills it from `git ls-remote`, so it names the tip
      # the reviewer actually saw.
      expected_sha:
        description: 'Commit `main` must still be, or the run refuses (local/dispatch-release.mjs sets it)'
        required: false
        default: ''
        type: string
      version_suffix:
        description: 'Suffix appended to the upstream base version (default: np.<run number>)'
        required: false
        default: ''
        type: string
      # Why: a change to this workflow has to be provable without publishing to every install. The
      # whole run happens — gates, draft, all three legs, every check in `publish` — and only the
      # undraft is skipped, so the draft can be inspected and deleted. Nothing else reads it.
      keep_draft:
        description: 'Validation run: build and upload everything, run every publish check, leave the release a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Why one release run at a time: two dispatches running together can each create a draft, or the
# lower version can finish last and its undraft make it `releases/latest`. Why not cancel: a release
# run cancelled mid-upload leaves a half-filled draft. GitHub keeps at most ONE run pending per group:
# whatever is queued next — a dispatch, a `keep_draft` validation, a `--failed` re-run — cancels the
# run already pending, whichever of them mattered more. Queue nothing behind a pending release.
concurrency:
  group: fork-release
  cancel-in-progress: false

# Why the same version for every job: the mac, windows and linux artifacts of one release must
# agree, and the updater compares the version baked into each manifest. `release-ref` derives it once,
# from the upstream base version and the run number, and every later job reads
# `needs.release-ref.outputs.version` — so the version the guard approved is the version every job
# stamps, and the formula exists once.
env:
  PUBLISH_OWNER: nplez1

jobs:
  # Why a job of its own: every leg publishes into the same release, so a dispatch from anywhere but
  # the fork's release line, or into a tag that already points at a different commit, has to fail
  # before the first artifact is built. `workflow_dispatch` accepts any ref, and the tag check used
  # to be "the tag exists, upload into it".
  release-ref:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Require the fork's release branch and this commit's tag
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: ${{ inputs.version_suffix }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          # Why before the guard: the reviewer approved one commit and the build runs another if
          # `main` moved since. A dispatch without the input (a hand-run) keeps the old behaviour.
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::dispatched for $EXPECTED_SHA, but this run is at $GITHUB_SHA — main moved since the review; re-review the new tip and dispatch again"
            exit 1
          fi
          base="$(node .github/scripts/fork-upstream-base-version.mjs)"
          # Why the upstream base and not package.json: the base triple names the upstream Orca a build
          # is comparable to, and upstream bumps package.json on its release line, not on main.
          version="${base}-${SUFFIX:-np.${GITHUB_RUN_NUMBER}}"
          bash .github/scripts/fork-release-ref-guard.sh \
            "$GITHUB_REF" "v$version" "$GITHUB_SHA" "$PUBLISH_OWNER/orca"
          # Why only after the guard passed: no later job can read a version it refused.
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Releasing $version"

  # Why: the suite, on the exact commit being released, before a single artifact is built. It is the
  # same reusable workflow, the same shard plan and the same fork shard verdict every other unit lane
  # uses, so a red here means what it means on `fork-main-tests.yml` — and `local/nightly-linux-known-red.json`
  # absorbs the Linux-only reds with evidence instead of being bypassed. ~12 min of wall clock on a
  # public repository that bills nothing, once per release.
  unit-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Why read-only: this job installs dependencies, which runs third-party composite actions and
    # package lifecycle scripts. It needs nothing from the release token, so it does not get one —
    # the same reasoning as the pins above.
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Shard plan
        id: plan
        run: node config/scripts/ci/unit-selection/ci-unit-plan.mjs

  unit-tests:
    needs: [release-ref, unit-plan]
    # Parity with `fork-main-tests.yml`: same Node major, same runner, same shard assignments, and
    # the relay job dropped for the same reason — this fork provisions no `blacksmith-*` runner for
    # it, and ships no cloud relay, so the job would queue forever rather than test anything.
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      runner: ubuntu-24.04-arm
      shards: ${{ needs.unit-plan.outputs.shards }}
      # `run_relay_integration` is gone: upstream removed the input and the relay job in the
      # 2026-11-20 sync. Passing it fails the call at startup with no jobs.

  # Why a job and not a step in the artifact legs: the verdict has to arrive once, before the first
  # artifact exists, and a step in each leg would spend the same minutes three times, after the unit
  # suite instead of alongside it. Same runner and same preparation as the
  # other two typecheck lanes, so a green here means what a green there means.
  typecheck:
    needs: release-ref
    runs-on: ubuntu-latest
    # Why 40: `fork-main-gates.yml` caps a hung `pnpm tc` at 40 minutes rather than the default 360,
    # and that budget was chosen for this command on this runner.
    timeout-minutes: 40
    # Why read-only: this job installs dependencies, which runs third-party composite actions and
    # package lifecycle scripts. It needs nothing from the release token — the same reasoning as
    # `unit-plan`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Why `native-runtime: node`: the preparation `fork-main-gates.yml` gives `pnpm tc` on this
      # runner, so a green here cannot be a green about a different install.
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Typecheck
        run: pnpm tc

  # Why the verdict and not `pnpm lint`: `pnpm lint` stops at the first failing step and has no notion
  # of a known red, so on a base carrying foreign reds it is red on every run — and this lane has to be
  # green on a clean release line rather than forgiven on a dirty one. `local/gate-lint.mjs` runs every
  # step of the chain plus `FORK_LINT_STEPS` and fails only on a red outside `local/lint-known-red.json`.
  # The allowlist is committed to the dispatched tree, so the verdict is that tree's own; the escape
  # hatch for a foreign red is the file, with evidence, exactly as it is for the suite above.
  lint:
    needs: release-ref
    runs-on: ubuntu-latest
    # Why 40: `fork-main-gates.yml` allows 50 for this verdict and `pnpm tc` together. Here the
    # typecheck is a job of its own, so the verdict gets the larger share of that budget.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Why: `check-upstream-file-comments` measures against the recorded sync base, and a CI checkout
      # has no such commit — the same fetch both other lanes make before the verdict.
      - name: Fetch the recorded upstream sync base
        run: |
          base=$(node -p 'require("./local/upstream-file-comments-baseline.json").base ?? ""')
          if [ -z "$base" ]; then
            echo "no sync base is recorded in local/upstream-file-comments-baseline.json" >&2
            exit 1
          fi
          git fetch --depth=1 origin "$base"

      # Why `ORCA_CODE_QUALITY_BASE: HEAD`: the gate also runs the diff-scoped steps
      # (`check:code-quality:changed` and the flaky-test-pattern ratchet), and a single-commit checkout
      # has no base to diff against. A red for a missing ref rather than for a finding is the failure
      # this lane exists to prevent.
      - name: Lint ratchet verdict
        env:
          ORCA_CODE_QUALITY_BASE: HEAD
        run: node local/gate-lint.mjs

  # Why a job of its own, ahead of every leg: the legs upload in parallel into one release, and
  # electron-builder's GitHub publisher creates that release itself when its listing finds none for
  # the tag (electron-publish `GitHubPublisher.getOrCreateRelease`, `publish: always`). Two legs that
  # both miss it each create one — a duplicate draft, or 422 "Published releases must have a valid
  # tag" for the loser, which is what killed run 35071546550's successor. Created here, before any
  # leg starts, the draft is what every leg's publisher finds, and finding a draft is always "append":
  # there is no create decision left to race.
  #
  # Why a draft: until every manifest is up, the release has assets a user can download but no update
  # manifest an installed build can follow. A draft is hidden from the releases list, so a run that
  # dies in that window leaves nothing visible. `publish` makes it public.
  #
  # Why after all three verdicts and not beside them: a red verdict leaves no draft behind.
  release-draft:
    needs: [release-ref, unit-tests, typecheck, lint]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
    steps:
      # Why full history: the release notes are generated from `git log <previous release tag>..HEAD`,
      # and the default clone carries one commit and no tags. Deepening to the tag would not be
      # enough either — this fork rebases onto upstream, so the previous tag is not on HEAD's line.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      # Why: an empty output would name the tag `v`, and every later step would act on that.
      - name: Require the version release-ref approved
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release-ref passed no version to this job"
            exit 1
          fi
          echo "Releasing $RELEASE_VERSION"

      # Why generated: the notes must say what changed, and a hand-maintained list goes stale. The
      # script derives the summary from git and never exits non-zero, so the guard below — not the
      # generator — decides whether this release has a summary (see "Release notes" in
      # RELEASE-RUNBOOK.md).
      - name: Generate the release notes
        shell: bash
        env:
          # Why a comparison rather than the secret: the notes only say whether this run signs, and
          # the expression hands this job a boolean instead of the certificate. It is the same test
          # `macos` applies when it resolves its signing mode.
          SIGNING: ${{ secrets.MAC_CERTS != '' }}
        run: |
          set -euo pipefail
          node .github/scripts/fork-release-notes.mjs \
            --version "$RELEASE_VERSION" \
            --sha "$GITHUB_SHA" \
            --repo "$PUBLISH_OWNER/orca" \
            --signing "$SIGNING" \
            --out /tmp/notes.md || true
          # Why this fails instead of substituting a minimal body: the runbook promises no release
          # goes public without its change summary, and a minimal body published anyway is exactly
          # the install-instructions-only release the generator was introduced to remove. Nothing
          # is created at this point, so failing here leaves no draft, no tag and no assets behind.
          node .github/scripts/fork-release-notes-guard.mjs /tmp/notes.md --label "the generated notes"

      # Why refuse a published release: the config's `releaseType: draft` makes electron-builder skip
      # the upload, with a warning and exit 0, when the release it finds is not a draft. Each leg's
      # manifest check then passes on the old manifest, so a re-dispatch into a published tag is a
      # green run that replaced nothing. Each leg re-checks this itself before it uploads, because a
      # leg can be re-run without this job.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"

          errors="$RUNNER_TEMP/release-view.err"
          # Why the error file: "no release yet" and "gh could not tell me" are different answers,
          # and creating on the second is how a second release under one tag would come about.
          if draft="$(gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json isDraft --jq .isDraft 2>"$errors")"; then
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published. electron-builder never appends to a published release under releaseType: draft, so the legs would upload nothing into it. Dispatch a new version instead."
              exit 1
            fi
            # Why this is not a second check: the release-ref job already refused a tag that points at
            # any other commit, so reaching here means this draft is this SHA's.
            echo "$tag is already a draft at $GITHUB_SHA; the legs upload into it"
          elif ! grep -qiE 'not found|HTTP 404' "$errors"; then
            echo "::error::cannot read release $tag: $(head -3 "$errors" | tr '\n' ' ')"
            exit 1
          else
            gh release create "$tag" \
              --repo "$PUBLISH_OWNER/orca" \
              --target "$GITHUB_SHA" \
              --draft \
              --notes-file /tmp/notes.md
            echo "created draft $tag"
          fi

  macos:
    # Why the three verdicts are named on every leg and not left to `release-draft`: a gate that hangs
    # off another job's `needs` is silently dropped the day that job's own `needs` change.
    needs: [release-ref, release-draft, unit-tests, typecheck, lint]
    runs-on: macos-15
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
    steps:
      # Why the default one-commit clone: the notes, which need history, are `release-draft`'s; the
      # build reads only `git rev-parse HEAD`. A full clone cost this leg 2-3 minutes.
      # Why no persisted credentials: `pnpm install` and the release build run third-party lifecycle
      # scripts, and a token left in `.git/config` is a push they could make. Every write here uses
      # `GH_TOKEN` from the environment instead.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          # Why no restore-keys: a prefix match lets any job on `main` — including the
          # read-only ones that run third-party install scripts — seed the cache a signing leg
          # then restores. A miss here is a cold download, which is the cheaper risk.
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}

      # Why both CPUs: the mac config packages x64 and arm64 from this arm64 runner, so the
      # install must carry both variants of the native optional deps or beforePack refuses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why conditional: the signed path needs a Developer ID certificate and notarization
      # credentials, but the update mechanism itself works on an unsigned build — Squirrel
      # only requires that every build carry the same signature identity, and one that is
      # absent is consistently absent. So this pipeline is usable before the certificate
      # exists, and switches to the signed path by itself once MAC_CERTS is set.
      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
        run: |
          set -euo pipefail
          if [[ -n "$MAC_CERTS" ]]; then
            echo "ORCA_MAC_RELEASE=1" >>"$GITHUB_ENV"
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::No MAC_CERTS secret, so this build is unsigned. It can still update itself, but macOS treats every build as a new app — Gatekeeper needs a manual override on first launch and privacy grants do not survive an update."
          fi

      - name: Verify macOS signing environment
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node config/scripts/desktop-distribution/macos/verify-macos-release-env.mjs

      # Why stamp the version: the base triple names the upstream Orca release this build is
      # comparable to, and two builds of the same version would compare equal — after which the
      # updater reports "no newer version" forever. The run-number suffix makes each release strictly
      # greater than the last, and `-np.` keeps it clearly distinct from anything upstream publishes.
      - name: Stamp the release version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release-ref passed no version to this job"
            exit 1
          fi
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$RELEASE_VERSION"
          echo "Releasing $RELEASE_VERSION"

      # Why before the build as well as before the upload: the build is the leg's long part, and a leg
      # re-run without its draft should fail in seconds rather than after it. The check before the
      # upload stays, because the draft can change while the leg builds.
      - name: Require this run's draft release before building
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fork-release-require-draft.sh "$PUBLISH_OWNER/orca" "v$RELEASE_VERSION"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why: a leg can run without `release-draft` running again ("Re-run job", or `--failed` after
      # the draft was deleted), and electron-builder then either creates a release of its own or,
      # for a published one, skips the upload with exit 0 while the old manifest makes this leg's
      # check pass. See the script for the electron-publish behaviour behind both.
      #
      # Why no step clears this leg's assets from an earlier attempt: electron-publish does it per
      # name — an upload that fails 422 `already_exists` deletes that asset and uploads again
      # (electron-publish 26.15.3 `gitHubPublisher.js:153-154` → `overwriteArtifact`, `:114-125`).
      # It matches by exact name, which is why every asset name here is already GitHub-safe (see
      # `mac.artifactName` in config/electron-builder.np.config.cjs): on np.38 a blockmap GitHub had
      # renamed was never found, and the retry died on it.
      - name: Require this run's draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fork-release-require-draft.sh "$PUBLISH_OWNER/orca" "v$RELEASE_VERSION"

      # Why --config.publish.owner: the checked-in config names stablyai/orca. Overriding here
      # rather than patching the config keeps that a runtime concern instead of a fork patch,
      # so upstream edits to the publish block still apply cleanly.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Why: the x64 terminal host is packaged on this arm64 runner and booted under Rosetta,
          # where the check's whole round trip (token, handshakes, shell output) costs several times
          # its ~14s local cost. The check stays required; only its deadline moves.
          ORCA_TERMINAL_HOST_BOOT_TIMEOUT_MS: '120000'
        run: |
          # Why unset: an unset secret still defines these as empty strings, and electron-builder
          # reads a defined CSC_LINK as a certificate path — resolving '' against the cwd and
          # failing with "<repo> not a file". The unsigned path must have no CSC_* at all.
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder --config config/electron-builder.np.config.cjs --mac \
            --publish always \
            --config.publish.owner=${{ env.PUBLISH_OWNER }} \
            --config.publish.repo=orca

      - name: Confirm the mac update manifest published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Why the explicit tag: the release is created as a draft, and `gh release list` hides
          # drafts, so discovering it by version would never find it.
          tag="v$RELEASE_VERSION"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets \
              --jq '.assets[].name' | grep -qx 'latest-mac.yml'; then
              echo "latest-mac.yml is present on $tag"
              exit 0
            fi
            echo "waiting for latest-mac.yml (attempt $attempt)"
            sleep 15
          done
          echo "::error::latest-mac.yml never appeared; an installed build will not see this release."
          exit 1

  # Why in parallel with `macos` and `linux`: each leg appends into the draft `release-draft`
  # created, and uploads only names no other leg publishes, so the legs share nothing but the release.
  windows:
    needs: [release-ref, release-draft, unit-tests, typecheck, lint]
    runs-on: windows-2022
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
    steps:
      # Why no persisted credentials: the leg runs third-party install scripts, and a token left in
      # `.git/config` is a push they could make.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          # Why no restore-keys: a prefix match lets any job on `main` — including the
          # read-only ones that run third-party install scripts — seed the cache a signing leg
          # then restores. A miss here is a cold download, which is the cheaper risk.
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Stamp the release version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release-ref passed no version to this job"
            exit 1
          fi
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$RELEASE_VERSION"
          echo "Releasing $RELEASE_VERSION"

      # Why before the build as well as before the upload: the build is the leg's long part, and a leg
      # re-run without its draft should fail in seconds rather than after it. The check before the
      # upload stays, because the draft can change while the leg builds.
      - name: Require this run's draft release before building
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fork-release-require-draft.sh "$PUBLISH_OWNER/orca" "v$RELEASE_VERSION"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why: a leg can run without `release-draft` running again ("Re-run job", or `--failed` after
      # the draft was deleted), and electron-builder then either creates a release of its own or,
      # for a published one, skips the upload with exit 0 while the old manifest makes this leg's
      # check pass. See the script for the electron-publish behaviour behind both.
      # Why no step clears this leg's assets from an earlier attempt: see the same step in `macos`.
      - name: Require this run's draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fork-release-require-draft.sh "$PUBLISH_OWNER/orca" "v$RELEASE_VERSION"

      # Why no signing env: this fork ships Windows unsigned (see LOCAL-PATCHES.md), and the
      # NP config drops publisherName so electron-updater does not reject its own next build.
      # SmartScreen warns once per installer; that is the accepted cost.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --config config/electron-builder.np.config.cjs --win `
            --publish always `
            --config.publish.owner=${{ env.PUBLISH_OWNER }} `
            --config.publish.repo=orca

      - name: Confirm the Windows update manifest published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Why the explicit tag: the release is a draft until `publish` finishes, and
          # `gh release list` hides drafts.
          tag="v$RELEASE_VERSION"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets \
              --jq '.assets[].name' | grep -qx 'latest.yml'; then
              echo "latest.yml is present on $tag"
              exit 0
            fi
            echo "waiting for latest.yml (attempt $attempt)"
            sleep 15
          done
          echo "::error::latest.yml never appeared; an installed build will not see this release."
          exit 1

  # Why in parallel with the other legs: see `windows`. The undraft is not here either — it is
  # `publish`, which waits for all three.
  linux:
    needs: [release-ref, release-draft, unit-tests, typecheck, lint]
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
    steps:
      # Why no persisted credentials: the leg runs third-party install scripts, and a token left in
      # `.git/config` is a push they could make.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          # Why no restore-keys: a prefix match lets any job on `main` — including the
          # read-only ones that run third-party install scripts — seed the cache a signing leg
          # then restores. A miss here is a cold download, which is the cheaper risk.
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}

      # Why no --cpu flags and no retry wrapper: this job packages only for its own runner OS and
      # architecture, so the default host-scoped install is the correct one (upstream's linux release
      # leg does the same).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why: `pnpm build:release` verifies the Linux computer-use provider by importing AT-SPI
      # bindings, which are runtime package deps but not present on stock GitHub Ubuntu runners.
      # Why rpm: electron-builder's fpm backend shells out to it to produce the .rpm artifact.
      # Why Docker is not installed here: the Wayland clipboard helper is compiled in Docker by
      # beforePack, and ubuntu-latest runners ship it.
      - name: Install Linux packaging dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm

      # Why stamp the version: same reason as the other jobs — every release must compare strictly
      # greater than the last, and all three platforms must agree on it.
      - name: Stamp the release version
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release-ref passed no version to this job"
            exit 1
          fi
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$RELEASE_VERSION"
          echo "Releasing $RELEASE_VERSION"

      # Why before the build as well as before the upload: the build is the leg's long part, and a leg
      # re-run without its draft should fail in seconds rather than after it. The check before the
      # upload stays, because the draft can change while the leg builds.
      - name: Require this run's draft release before building
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fork-release-require-draft.sh "$PUBLISH_OWNER/orca" "v$RELEASE_VERSION"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why: a leg can run without `release-draft` running again ("Re-run job", or `--failed` after
      # the draft was deleted), and electron-builder then either creates a release of its own or,
      # for a published one, skips the upload with exit 0 while the old manifest makes this leg's
      # check pass. See the script for the electron-publish behaviour behind both.
      # Why no step clears this leg's assets from an earlier attempt: see the same step in `macos`.
      - name: Require this run's draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/fork-release-require-draft.sh "$PUBLISH_OWNER/orca" "v$RELEASE_VERSION"

      # Why ensure-native-runtime first: electron-builder's beforeBuild rebuilds node-pty for the
      # Electron ABI, and the Linux leg has to start from the runtime variant the app actually
      # loads — upstream's release leg does the same on every Linux matrix entry.
      #
      # Why the publish overrides: the checked-in config names stablyai/orca. Overriding here rather
      # than patching the config keeps that a runtime concern instead of a fork patch, so upstream
      # edits to the publish block still apply cleanly. `--publish always` plus the config's own
      # `releaseType: draft` appends into the draft `release-draft` created.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.np.config.cjs --linux AppImage deb rpm \
            --x64 --publish always \
            --config.publish.owner=${{ env.PUBLISH_OWNER }} \
            --config.publish.repo=orca

      - name: Confirm the Linux update manifest published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Why the explicit tag: the release is a draft until `publish` finishes, and
          # `gh release list` hides drafts.
          tag="v$RELEASE_VERSION"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets \
              --jq '.assets[].name' | grep -qx 'latest-linux.yml'; then
              echo "latest-linux.yml is present on $tag"
              exit 0
            fi
            echo "waiting for latest-linux.yml (attempt $attempt)"
            sleep 15
          done
          echo "::error::latest-linux.yml never appeared; an installed AppImage will not see this release."
          exit 1

  # Why a job of its own, after all three legs: a release that goes live before every platform's
  # manifest exists offers downloads that no installed build can update from, so "published" has to
  # mean "complete". It used to be the last step of the last serialized leg; with the legs parallel,
  # only a job that needs all three can know they are all done.
  #
  # Why the verdicts are named here too: the same reason as on the legs.
  publish:
    needs: [release-ref, release-draft, unit-tests, typecheck, lint, macos, windows, linux]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.release-ref.outputs.version }}
    steps:
      # Why full history: the guard below reads the published tags, and resolves a branch-named
      # target through the tag's own commit — the same checkout `release-ref` makes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      # Why again: `gh run rerun --failed` re-runs a failed leg and this job, and keeps the
      # `release-ref` that passed — possibly hours ago. The ref, the commit and the version are this
      # run's and cannot change; the published tags can, and a draft made public below the newest one
      # points `releases/latest` at an older build. So the check that reads them runs where it matters.
      - name: Re-check the release ref and version against the tags as they are now
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/fork-release-ref-guard.sh \
            "$GITHUB_REF" "v$RELEASE_VERSION" "$GITHUB_SHA" "$PUBLISH_OWNER/orca"

      # Why every manifest again, and exactly one release: each leg confirmed its own manifest, but
      # a `--failed` re-run keeps legs that passed in an earlier attempt, and a second release under
      # this tag is what a create race between legs would leave. Both are cheap to rule out here.
      - name: Confirm one release carries every platform's manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          count="$(gh api --paginate "repos/$PUBLISH_OWNER/orca/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::$count releases carry $tag; expected exactly one. Delete the extra draft before publishing."
            exit 1
          fi
          assets="$(gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets --jq '.assets[].name')"
          missing=0
          for manifest in latest-mac.yml latest.yml latest-linux.yml; do
            if ! printf '%s\n' "$assets" | grep -qxF "$manifest"; then
              echo "::error::$manifest is missing from $tag; an installed build on that platform will not see this release."
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          echo "$tag carries latest-mac.yml, latest.yml and latest-linux.yml"

      # Why the body is checked again here: this is the step that makes the release public, and the
      # body can change between generation and now — a re-run keeps the draft it created, and the
      # runbook tells whoever reads the draft to edit a wrong body before it goes live. A failure
      # leaves the release a draft, which no installed build can see.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DRAFT: ${{ inputs.keep_draft }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json body --jq .body \
            | node .github/scripts/fork-release-notes-guard.mjs - --site draft --label "the draft body of $tag"
          # Why: "Re-run job" on this job after its own undraft reaches here with a published release,
          # and neither the validation notice nor the edit applies to it. Why an assignment: `set -e`
          # does not see a failure inside a `[` argument, so a gh error there read as "published" and
          # left the release a draft with a green run. Only a literal `false` skips; anything but
          # `true` after that is an answer this step does not understand.
          draft="$(gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json isDraft --jq .isDraft)"
          if [ "$draft" = "false" ]; then
            echo "$tag is already published; nothing to do"
            exit 0
          fi
          if [ "$draft" != "true" ]; then
            echo "::error::cannot tell whether $tag is a draft (isDraft=$draft)"
            exit 1
          fi
          if [ "$KEEP_DRAFT" = "true" ]; then
            echo "::notice title=Validation run::keep_draft is set, so $tag stays a draft. Every check passed; delete it with: gh release delete $tag --repo $PUBLISH_OWNER/orca --yes"
            exit 0
          fi
          gh release edit "$tag" --repo "$PUBLISH_OWNER/orca" --draft=false
          echo "published $tag"
