name: Fork release

# Builds distributable macOS, Windows and Linux artifacts from this fork and publishes them as a
# GitHub release here. That release is the update feed this fork's builds point at (see
# LOCAL-PATCHES.md), so publishing here is what makes an installed build update itself.
#
# Every upstream release workflow is a no-op in a fork — they all guard on
# `github.repository == 'stablyai/orca'` — and they publish to stablyai's separate
# orca-hourly/orca-daily/orca-adhoc repos. This one publishes to the fork itself, which
# is why it needs no GitHub App token: the workflow's own GITHUB_TOKEN can create
# releases in its own repository.
#
# Tests and lint are deliberately not run here. They are the gate for a PR, not for a
# build you intend to hand to someone; run `pnpm test` yourself when it matters. What is gated is the
# dispatch itself: the `release-ref` job refuses any ref but `refs/heads/nplez1/main`, and any tag
# that already points at another commit.

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Suffix appended to package.json version (default: np.<run number>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Why the same version for every job: the mac, windows and linux artifacts of one release must
# agree, and the updater compares the version baked into each manifest. github.run_number is
# identical across jobs in a run, so deriving from it keeps them in step without passing state around.
env:
  PUBLISH_OWNER: nplez1

jobs:
  # Why a job of its own: every leg publishes into the same release, so a dispatch from anywhere but
  # the fork's release line, or into a tag that already points at a different commit, has to fail
  # before the first artifact is built. `workflow_dispatch` accepts any ref, and the tag check used
  # to be "the tag exists, upload into it".
  release-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Require the fork's release branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/nplez1/main" ]; then
            echo "::error::a release must be dispatched from refs/heads/nplez1/main, not $GITHUB_REF — this tag is the update feed every installed build reads."
            exit 1
          fi

      - name: Require an existing tag to point at this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          tag="v${base}-${SUFFIX:-np.${GITHUB_RUN_NUMBER}}"
          if ! gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json targetCommitish >/dev/null 2>&1; then
            echo "$tag does not exist yet; this run creates it at $GITHUB_SHA"
            exit 0
          fi
          target="$(gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json targetCommitish --jq '.targetCommitish')"
          # Why the tag ref as well: a release created by electron-builder records the branch it was
          # published from, not the SHA, so the comparison has to resolve that name before refusing.
          if [ "${target,,}" = "${GITHUB_SHA,,}" ] || [ "$(git rev-parse "$target^{commit}" 2>/dev/null || true)" = "$GITHUB_SHA" ]; then
            echo "$tag already exists at $GITHUB_SHA; uploading into it"
            exit 0
          fi
          echo "::error::$tag already exists at $target, not $GITHUB_SHA. Re-dispatching from a newer commit would replace its assets while the tag and notes still point at the old revision."
          exit 1

  macos:
    needs: release-ref
    runs-on: macos-15
    steps:
      # Why full history: the release notes are generated from `git log <previous release tag>..HEAD`,
      # and the default clone carries one commit and no tags. Deepening to the tag would not be
      # enough either — this fork rebases onto upstream, so the previous tag is not on HEAD's line.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why both CPUs: the mac config packages x64 and arm64 from this arm64 runner, so the
      # install must carry both variants of the native optional deps or beforePack refuses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why conditional: the signed path needs a Developer ID certificate and notarization
      # credentials, but the update mechanism itself works on an unsigned build — Squirrel
      # only requires that every build carry the same signature identity, and one that is
      # absent is consistently absent. So this pipeline is usable before the certificate
      # exists, and switches to the signed path by itself once MAC_CERTS is set.
      - name: Resolve signing mode
        id: signing
        shell: bash
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
        run: |
          set -euo pipefail
          if [[ -n "$MAC_CERTS" ]]; then
            echo "ORCA_MAC_RELEASE=1" >>"$GITHUB_ENV"
            echo "signed=true" >>"$GITHUB_OUTPUT"
          else
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::No MAC_CERTS secret, so this build is unsigned. It can still update itself, but macOS treats every build as a new app — Gatekeeper needs a manual override on first launch and privacy grants do not survive an update."
          fi

      - name: Verify macOS signing environment
        if: steps.signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node config/scripts/verify-macos-release-env.mjs

      # Why stamp the version: upstream's numbering is not a stream this fork can ride — two
      # builds of the same package.json version compare equal and the updater then reports
      # "no newer version" forever. Appending the run number gives each release a version
      # strictly greater than the last, and the -np. pre-release suffix keeps it clearly
      # distinct from anything upstream publishes.
      - name: Stamp the release version
        shell: bash
        env:
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          version="${base}-${SUFFIX:-np.${GITHUB_RUN_NUMBER}}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$version"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "Releasing $version"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why generated: the notes must say what changed, and a hand-maintained list goes stale. The
      # script derives the summary from git and never exits non-zero, so a release can still be cut
      # when history is unusable (see "Release notes" in RELEASE-RUNBOOK.md).
      - name: Generate the release notes
        shell: bash
        env:
          SIGNING: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          node .github/scripts/fork-release-notes.mjs \
            --version "$RELEASE_VERSION" \
            --sha "$GITHUB_SHA" \
            --repo "$PUBLISH_OWNER/orca" \
            --signing "$SIGNING" \
            --out /tmp/notes.md || true
          # Why the check: an empty file is not the only failure — a missing file, a partially
          # written body, or the generator's last-resort stub all publish a release with no change
          # summary. Require the heading the generator always emits and a body long enough to be the
          # whole template rather than a fragment; anything else gets the minimal body instead.
          size=0
          if [ -f /tmp/notes.md ]; then
            size="$(wc -c </tmp/notes.md | tr -d '[:space:]')"
          fi
          if ! grep -q '^## What changed' /tmp/notes.md 2>/dev/null || [ "$size" -lt 400 ]; then
            echo "::warning title=Release notes::The notes body is empty or incomplete; publishing a minimal body instead."
            printf '**Orca NP %s**\n\nBuilt from `%s`.\n' "$RELEASE_VERSION" "$GITHUB_SHA" >/tmp/notes.md
          fi

      # Why create the release up front, as a draft: electron-builder's publisher would otherwise
      # have two artifact legs race to create it, and the loser aborts the whole job with
      # 422 "Published releases must have a valid tag" even though the winner succeeded — which is
      # exactly what killed runs 35071546550's successor.
      #
      # Why a draft: until the manifest check below passes, the release has assets a user can
      # download but no `latest-mac.yml`, so no installed build can update from it. A draft is
      # hidden from the releases list, so a run that dies in that window leaves nothing visible.
      # It goes live at the end of the windows job, once every platform's manifest is up.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"

          if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" >/dev/null 2>&1; then
            # Why this is not a second check: the release-ref job already refused a tag that points at
            # any other commit, so reaching here means this tag is this SHA's.
            echo "$tag already exists at $GITHUB_SHA; uploading into it"
          else
            gh release create "$tag" \
              --repo "$PUBLISH_OWNER/orca" \
              --target "$GITHUB_SHA" \
              --draft \
              --notes-file /tmp/notes.md
            echo "created draft $tag"
          fi

      # Why before packaging: electron-builder appends to the release and fails on a name that
      # already exists, so a retry after a partial publish (a notarization timeout, a lost
      # connection) has to clear this leg's own assets first — and only this leg's.
      - name: Clear macOS assets from an earlier attempt
        uses: ./.github/actions/clear-release-assets
        with:
          repo: ${{ env.PUBLISH_OWNER }}/orca
          tag: v${{ env.RELEASE_VERSION }}
          patterns: '^(orca-macos-(x64|arm64)\\.dmg(\\.blockmap)?|Orca[.-]NP-[^/]*-mac\\.zip(\\.blockmap)?|latest-mac\\.yml)$'

      # Why --config.publish.owner: the checked-in config names stablyai/orca. Overriding here
      # rather than patching the config keeps that a runtime concern instead of a fork patch,
      # so upstream edits to the publish block still apply cleanly.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Why: the x64 terminal host is packaged on this arm64 runner and booted under Rosetta,
          # where the check's whole round trip (token, handshakes, shell output) costs several times
          # its ~14s local cost. The check stays required; only its deadline moves.
          ORCA_TERMINAL_HOST_BOOT_TIMEOUT_MS: '120000'
        run: |
          # Why unset: an unset secret still defines these as empty strings, and electron-builder
          # reads a defined CSC_LINK as a certificate path — resolving '' against the cwd and
          # failing with "<repo> not a file". The unsigned path must have no CSC_* at all.
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder --config config/electron-builder.np.config.cjs --mac \
            --publish always \
            --config.publish.owner=${{ env.PUBLISH_OWNER }} \
            --config.publish.repo=orca

      - name: Confirm the mac update manifest published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Why the explicit tag: the release is created as a draft, and `gh release list` hides
          # drafts, so discovering it by version would never find it.
          tag="v$RELEASE_VERSION"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets \
              --jq '.assets[].name' | grep -qx 'latest-mac.yml'; then
              echo "latest-mac.yml is present on $tag"
              exit 0
            fi
            echo "waiting for latest-mac.yml (attempt $attempt)"
            sleep 15
          done
          echo "::error::latest-mac.yml never appeared; an installed build will not see this release."
          exit 1

  # Why serialized behind macos: every job publishes into the same release, and electron-builder
  # decides whether to create or append at upload time. Running them at once races that decision.
  windows:
    needs: macos
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Stamp the release version
        shell: bash
        env:
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          version="${base}-${SUFFIX:-np.${GITHUB_RUN_NUMBER}}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$version"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "Releasing $version"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why before packaging: electron-builder appends to the release and fails on a name that
      # already exists, so a retry after a partial publish (a notarization timeout, a lost
      # connection) has to clear this leg's own assets first — and only this leg's.
      - name: Clear Windows assets from an earlier attempt
        uses: ./.github/actions/clear-release-assets
        with:
          repo: ${{ env.PUBLISH_OWNER }}/orca
          tag: v${{ env.RELEASE_VERSION }}
          patterns: '^(orca-windows-setup\\.exe(\\.blockmap)?|latest\\.yml)$'

      # Why no signing env: this fork ships Windows unsigned (see LOCAL-PATCHES.md), and the
      # NP config drops publisherName so electron-updater does not reject its own next build.
      # SmartScreen warns once per installer; that is the accepted cost.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --config config/electron-builder.np.config.cjs --win `
            --publish always `
            --config.publish.owner=${{ env.PUBLISH_OWNER }} `
            --config.publish.repo=orca

      - name: Confirm the Windows update manifest published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Why the explicit tag: the release is a draft until this job finishes, and
          # `gh release list` hides drafts.
          tag="v$RELEASE_VERSION"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets \
              --jq '.assets[].name' | grep -qx 'latest.yml'; then
              echo "latest.yml is present on $tag"
              exit 0
            fi
            echo "waiting for latest.yml (attempt $attempt)"
            sleep 15
          done
          echo "::error::latest.yml never appeared; an installed build will not see this release."
          exit 1

      # Why not here any more: the release is undrafted by the last job, and Linux's manifest has
      # to exist before it does. See the linux job below.

  # Why serialized behind windows, and why last: every job appends into one release, and
  # electron-builder decides whether to create or append at upload time — concurrent legs race that
  # decision. The undraft has to be the final step of the final leg, because a release that goes
  # live before the last platform's manifest exists offers downloads no installed build can
  # update from.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-

      # Why no --cpu flags and no retry wrapper: this job packages only for its own runner OS and
      # architecture, so the default host-scoped install is the correct one (upstream's linux release
      # leg does the same).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why here: electron-builder's beforePack requires out/mobile-web, and the bundle
      # build resolves React Native and Expo from mobile/node_modules.
      - uses: ./.github/actions/install-mobile-dependencies

      # Why: `pnpm build:release` verifies the Linux computer-use provider by importing AT-SPI
      # bindings, which are runtime package deps but not present on stock GitHub Ubuntu runners.
      # Why rpm: electron-builder's fpm backend shells out to it to produce the .rpm artifact.
      # Why Docker is not installed here: the Wayland clipboard helper is compiled in Docker by
      # beforePack, and ubuntu-latest runners ship it.
      - name: Install Linux packaging dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-gi gir1.2-atspi-2.0 at-spi2-core xclip xdotool rpm

      # Why stamp the version: same reason as the other jobs — every release must compare strictly
      # greater than the last, and all three platforms must agree on it.
      - name: Stamp the release version
        shell: bash
        env:
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          version="${base}-${SUFFIX:-np.${GITHUB_RUN_NUMBER}}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$version"
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
          echo "Releasing $version"

      - name: Build app
        run: pnpm build:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Why ensure-native-runtime first: electron-builder's beforeBuild rebuilds node-pty for the
      # Electron ABI, and the Linux leg has to start from the runtime variant the app actually
      # Why before packaging: electron-builder appends to the release and fails on a name that
      # already exists, so a retry after a partial publish (a notarization timeout, a lost
      # connection) has to clear this leg's own assets first — and only this leg's.
      - name: Clear Linux assets from an earlier attempt
        uses: ./.github/actions/clear-release-assets
        with:
          repo: ${{ env.PUBLISH_OWNER }}/orca
          tag: v${{ env.RELEASE_VERSION }}
          patterns: '^(latest-linux\\.yml|orca-linux[^/]*\\.AppImage|orca-np[_-][^/]*\\.(deb|rpm))$'

      # loads — upstream's release leg does the same on every Linux matrix entry.
      #
      # Why the publish overrides: the checked-in config names stablyai/orca. Overriding here rather
      # than patching the config keeps that a runtime concern instead of a fork patch, so upstream
      # edits to the publish block still apply cleanly. `--publish always` plus the config's own
      # `releaseType: draft` appends into the draft the macos job created.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.np.config.cjs --linux AppImage deb rpm \
            --x64 --publish always \
            --config.publish.owner=${{ env.PUBLISH_OWNER }} \
            --config.publish.repo=orca

      - name: Confirm the Linux update manifest published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Why the explicit tag: the release is a draft until this job finishes, and
          # `gh release list` hides drafts.
          tag="v$RELEASE_VERSION"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" --repo "$PUBLISH_OWNER/orca" --json assets \
              --jq '.assets[].name' | grep -qx 'latest-linux.yml'; then
              echo "latest-linux.yml is present on $tag"
              exit 0
            fi
            echo "waiting for latest-linux.yml (attempt $attempt)"
            sleep 15
          done
          echo "::error::latest-linux.yml never appeared; an installed AppImage will not see this release."
          exit 1

      # Why here and not in an earlier job: every platform uploads into one release, and a release
      # that goes live before the last platform's manifest exists offers downloads that no installed
      # build can update from. Flipping it last makes "published" mean "complete".
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "v$RELEASE_VERSION" --repo "$PUBLISH_OWNER/orca" --draft=false
          echo "published v$RELEASE_VERSION"
