name: Mirror upstream release tags

# Why: `tests/e2e/cross-version-wire/` materializes released versions by tag, and it pins
# tags that only exist upstream. When this fork lags upstream's release train, that job
# fails for every branch with "could not resolve ref vX.Y.Z" — a red check about this
# fork's tag list, not about the change under test.
#
# Only `v*` desktop tags are mirrored. The mobile release workflows trigger on
# `mobile-ios-v*` / `mobile-android-v*`, so fetching those would start App Store and Play
# builds; no desktop workflow triggers on a tag push, so `v*` is inert.
#
# Why a token other than `GITHUB_TOKEN`: a tag brings the commits behind it, and pushing
# workflow-file changes needs the `workflows` permission, which the Actions `GITHUB_TOKEN` can
# never hold — `permissions:` has no `workflows` scope to grant. Upstream's release cuts routinely
# touch `.github/workflows/**`, so `git push origin --tags` is rejected server-side: "Unable to
# determine if workflow can be created or updated due to timeout; `workflows` scope may be
# required". Those tags are release-line commits that are not ancestors of `upstream/main`, so no
# later sync makes them already present and the rejection repeats on every run.
#
# So the checkout authenticates with `FORK_TAG_MIRROR_TOKEN`: a fine-grained PAT scoped to
# `nplez1/orca` with Contents: read and write, plus Workflows: read and write. `actions/checkout`
# persists it in the checkout's git config, which is the credential the `git push` below uses.
#
# Two consequences of the PAT: unlike a `GITHUB_TOKEN` push, it starts workflows, so the
# `v*`-is-inert note above is now the only guard; and it expires, so rotate it before the job
# starts failing at checkout. Until the secret exists at all, `token` is empty and checkout stops
# at "Input required and not supplied: token" rather than falling back to the built-in token.
on:
  schedule:
    # Off the hour, to stay off the release-train cron pile-up.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  # The PAT does both the checkout and the push; nothing uses the built-in token, so keep it
  # read-only.
  contents: read

concurrency:
  group: mirror-upstream-release-tags
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_TAG_MIRROR_TOKEN }}

      - name: Mirror upstream's desktop release tags
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/stablyai/orca.git
          # Tag refspec only: the mirror must never fetch or touch a branch.
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/v*'
          # No --force: an existing tag is never moved, so this only adds.
          git push origin --tags
          printf 'mirrored tags now include: %s\n' "$(git tag -l 'v*' | sort -V | tail -1)"
