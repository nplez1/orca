name: Fork CI health

# Why: the fork's health checks — `local/check-actions-enablement.mjs` (nothing enabled that should
# not be, nothing required disabled, no trigger or runner label that drifted), `local/check-nightly-liveness.mjs`
# (the nightly backstop is running, and green) and `local/check-queued-runs.mjs` (nothing is waiting for
# a runner that will never pick it up) — existed and were run by nobody. `rg` found them only in docs and
# a test. The cost was concrete: a cache sweep stayed active from about 2026-10-25 undetected until
# 10-28, after it had deleted 9.39 GB of `main` caches, and a nightly issue sat open while the
# last three runs were failure, success, success. The queued-run check is the one that bounds what
# `timeout-minutes` cannot: a label nothing provisions waits for the 24 h queue limit, not its timeout.
#
# Daily rather than on every push: the state it reads (workflow enablement, the last few scheduled
# runs, the queue) changes on a day's timescale, and a check that costs nothing still costs attention
# when it fires every hour. `local/ci-health-report.mjs` owns the reporting: one issue, updated in
# place, closed when the checks are all clean again.
#
# Why it can afford `issues: write`: it owns exactly one issue, and the token is scoped to this
# repository. `actions` is `write` rather than `read` because the same token disables the workflow files
# a sync re-enabled (see the note on `permissions` below); it is what reads run history for the liveness
# check too, since write implies read.
#
# Why a second token: a red issue is delegated to the autonomous pipeline by applying `agent:auto`,
# and `driver.py::_labeler_permission` refuses a label whose `labeled` actor is a bot — "an agent
# holding a token must not be able to queue work for itself". `GITHUB_TOKEN` is `github-actions[bot]`,
# so the label has to be applied by `AGENT_DELEGATE_TOKEN`, a token whose actor is a collaborator with
# write access. Without it the report still runs and still opens the issue; it exits 2 rather than
# filing a red night nobody picks up.
on:
  schedule:
    # Off the hour, and after the 04:53 nightly has settled: a check that runs while the nightly is
    # mid-flight reports a run that has no verdict yet.
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Why write: an upstream sync enables every workflow file it adds, and GitHub has no tree-level way to
  # say "off" (`LOCAL-PATCHES.md` § local(ci)). The lane therefore runs the enablement check with
  # `--fix`, which needs `actions: write` to disable a file and to cancel a run it had already started.
  # Not reachable from untrusted input: this workflow has no `pull_request` trigger and takes no
  # payload, so the token is only ever used by code on the ref it checked out. All three checks run on
  # this one token and only the enablement check uses the write scope; minting a second read-only token
  # for the other two would buy nothing while all three are this fork's own scripts. `--fix` is refused
  # off `refs/heads/main` inside `local/ci-health-report.mjs` (`maySweep`), so a dispatch from an older
  # branch cannot switch off a lane that branch predates.
  actions: write
  issues: write

concurrency:
  group: fork-ci-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Why the whole install for two scripts: the enablement check parses each workflow's `on:` keys,
      # and a YAML parser is worth a dependency rather than a hand-rolled scanner that reads the
      # block forms wrong. The job is daily and bills nothing on this repository.
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none

      # `--fix` lets the enablement check clear inherited drift itself. What it may disable is decided
      # in `local/check-actions-enablement.mjs`: never a `REQUIRED` lane, and never a fork-owned one
      # (`.github/workflows/fork-*.yml`), because a sync cannot have added those — a person did, so a
      # person decides (that case exits 3, which withholds `agent:auto`). What it disabled is quoted into
      # the close comment when an issue was open; when none was, the run log and the workflows' own
      # `disabled_manually` state are the record.
      - name: Run the health checks and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DELEGATE_TOKEN: ${{ secrets.AGENT_DELEGATE_TOKEN }}
        run: node local/ci-health-report.mjs --fix
